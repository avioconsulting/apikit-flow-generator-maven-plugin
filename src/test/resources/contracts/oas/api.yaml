openapi: 3.0.3
info:
  title: Orders
  version: 1.0.0
paths:
  /health:
    get:
      responses:
        '200':
          description: Healthy
  /orders/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: './schemas/order.yaml'
              example:
                name: Example order
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: './schemas/order.yaml'
          application/xml:
            schema:
              $ref: './schemas/order.yaml'
      responses:
        '201':
          description: Created
